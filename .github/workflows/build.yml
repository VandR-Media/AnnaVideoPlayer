name: Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install approved Annavue logo resources
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode brand/annavue_icon.jpg.b64 > /tmp/annavue_full_logo.jpg
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("/tmp/annavue_full_logo.jpg").convert("RGB")
          # The source is a padded launcher tile. Detect the actual luminous artwork
          # in its upper illustration region before scaling; fixed-coordinate crops
          # preserve the huge empty margins and make the mark appear tiny.
          width, height = source.size
          region = source.crop((0, 0, width, int(height * 0.70)))
          import numpy as np
          pixels = np.asarray(region)
          mask = (pixels.max(axis=2) > 34) & ((pixels.max(axis=2) - pixels.min(axis=2)) > 10)
          ys, xs = np.where(mask)
          if len(xs) == 0:
              raise SystemExit("Could not detect the neon illustration in the approved logo source")
          pad_x = max(4, int((xs.max() - xs.min() + 1) * 0.05))
          pad_y = max(4, int((ys.max() - ys.min() + 1) * 0.05))
          left = max(0, int(xs.min()) - pad_x)
          top = max(0, int(ys.min()) - pad_y)
          right = min(width, int(xs.max()) + 1 + pad_x)
          bottom = min(int(height * 0.70), int(ys.max()) + 1 + pad_y)
          mark = region.crop((left, top, right, bottom))
          canvas = Image.new("RGB", (720, 720), (8, 6, 16))
          mark.thumbnail((660, 660), Image.Resampling.LANCZOS)
          canvas.paste(mark, ((720 - mark.width) // 2, (720 - mark.height) // 2))
          out = Path("app/src/main/res/drawable-nodpi/annavue_brand_mark.png")
          out.parent.mkdir(parents=True, exist_ok=True)
          canvas.save(out, optimize=True)
          PY
          cp /tmp/annavue_full_logo.jpg app/src/main/res/drawable-nodpi/annavue_brand_logo.jpg
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$density
            cp app/src/main/res/drawable-nodpi/annavue_brand_logo.jpg app/src/main/res/mipmap-$density/ic_launcher.jpg
          done
      - name: Run tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Annavue-0.5.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
