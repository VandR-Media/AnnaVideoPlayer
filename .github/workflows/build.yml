name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Release credentials are considered only for the default branch.
      RELEASE_SIGNING_READY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANNAVUE_KEYSTORE_BASE64 != '' && secrets.ANNAVUE_STORE_PASSWORD != '' && secrets.ANNAVUE_KEY_ALIAS != '' && secrets.ANNAVUE_KEY_PASSWORD != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set up Gradle and validate the Wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install required Android SDK packages
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Verify Gradle Wrapper
        run: ./gradlew --version

      - name: Run unit tests, Android Lint, and build debug APK
        run: ./gradlew --no-daemon --stacktrace --no-build-cache clean testDebugUnitTest lintDebug assembleDebug

      - name: Prepare release signing key
        if: env.RELEASE_SIGNING_READY == 'true'
        env:
          ANNAVUE_KEYSTORE_BASE64: ${{ secrets.ANNAVUE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          install -d -m 700 app/signing
          printf '%s' "$ANNAVUE_KEYSTORE_BASE64" | base64 --decode > app/signing/annavue-release.jks
          chmod 600 app/signing/annavue-release.jks

      - name: Build signed release APK
        if: env.RELEASE_SIGNING_READY == 'true'
        env:
          ANNAVUE_STORE_FILE: app/signing/annavue-release.jks
          ANNAVUE_STORE_PASSWORD: ${{ secrets.ANNAVUE_STORE_PASSWORD }}
          ANNAVUE_KEY_ALIAS: ${{ secrets.ANNAVUE_KEY_ALIAS }}
          ANNAVUE_KEY_PASSWORD: ${{ secrets.ANNAVUE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace --no-build-cache testReleaseUnitTest lintRelease assembleRelease

      - name: Verify release APK is production-safe
        if: env.RELEASE_SIGNING_READY == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"

          "$ZIPALIGN" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"

          BADGING="$("$AAPT" dump badging "$APK")"
          if grep -q "application-debuggable" <<< "$BADGING"; then
            echo "::error::Release APK is marked debuggable."
            exit 1
          fi

          MANIFEST="$("$AAPT" dump xmltree "$APK" AndroidManifest.xml)"
          if grep -q "androidx.compose.ui.tooling.PreviewActivity" <<< "$MANIFEST"; then
            echo "::error::Debug-only Compose PreviewActivity leaked into the release APK."
            exit 1
          fi

          if grep -qi "CN=Android Debug" "$RUNNER_TEMP/apk-signature.txt"; then
            echo "::error::Release APK was signed with the Android debug certificate."
            exit 1
          fi

          echo "$BADGING" | grep "^package:"
          echo "::notice::Release APK is aligned, signed, non-debuggable, and excludes Compose PreviewActivity."

      - name: Upload signed release APK
        if: env.RELEASE_SIGNING_READY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Annavue-0.5.2-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Explain skipped signed release
        if: env.RELEASE_SIGNING_READY != 'true' && github.event_name != 'pull_request'
        run: echo "::notice::Signed release skipped. Run this workflow on main and configure all four ANNAVUE signing secrets."

      - name: Explain missing release signing configuration
        if: env.RELEASE_SIGNING_READY != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "::warning::No installable APK was published. Configure all four ANNAVUE signing secrets to produce the signed Release APK. Debug APKs are intentionally not uploaded."

      - name: Remove temporary signing key
        if: always() && env.RELEASE_SIGNING_READY == 'true'
        run: rm -f app/signing/annavue-release.jks
