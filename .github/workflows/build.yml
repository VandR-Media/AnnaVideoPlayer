name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_SIGNING_READY: ${{ secrets.ANNAVUE_KEYSTORE_BASE64 != '' && secrets.ANNAVUE_STORE_PASSWORD != '' && secrets.ANNAVUE_KEY_ALIAS != '' && secrets.ANNAVUE_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install approved Annavue logo resources
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode brand/annavue_icon.jpg.b64 > /tmp/annavue_full_logo.jpg
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("/tmp/annavue_full_logo.jpg").convert("RGB")
          width, height = source.size
          region = source.crop((0, 0, width, int(height * 0.70)))
          pixels = region.load()
          xs, ys = [], []
          for y in range(region.height):
              for x in range(region.width):
                  r, g, b = pixels[x, y]
                  if max(r, g, b) > 34 and max(r, g, b) - min(r, g, b) > 10:
                      xs.append(x)
                      ys.append(y)
          if not xs:
              raise SystemExit("Could not detect the neon illustration in the approved logo source")
          pad_x = max(4, int((max(xs) - min(xs) + 1) * 0.05))
          pad_y = max(4, int((max(ys) - min(ys) + 1) * 0.05))
          left = max(0, min(xs) - pad_x)
          top = max(0, min(ys) - pad_y)
          right = min(width, max(xs) + 1 + pad_x)
          bottom = min(int(height * 0.70), max(ys) + 1 + pad_y)
          mark = region.crop((left, top, right, bottom))
          canvas = Image.new("RGB", (720, 720), (8, 6, 16))
          mark.thumbnail((660, 660), Image.Resampling.LANCZOS)
          canvas.paste(mark, ((720 - mark.width) // 2, (720 - mark.height) // 2))
          out = Path("app/src/main/res/drawable-nodpi/annavue_brand_mark.png")
          out.parent.mkdir(parents=True, exist_ok=True)
          canvas.save(out, optimize=True)
          PY
          cp /tmp/annavue_full_logo.jpg app/src/main/res/drawable-nodpi/annavue_brand_logo.jpg
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$density
            cp app/src/main/res/drawable-nodpi/annavue_brand_logo.jpg app/src/main/res/mipmap-$density/ic_launcher.jpg
          done
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Annavue-0.5.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare release signing key
        if: env.RELEASE_SIGNING_READY == 'true'
        env:
          ANNAVUE_KEYSTORE_BASE64: ${{ secrets.ANNAVUE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/signing
          printf '%s' "$ANNAVUE_KEYSTORE_BASE64" | base64 --decode > app/signing/annavue-release.jks
          chmod 600 app/signing/annavue-release.jks
      - name: Build signed release APK
        if: env.RELEASE_SIGNING_READY == 'true'
        env:
          ANNAVUE_STORE_FILE: app/signing/annavue-release.jks
          ANNAVUE_STORE_PASSWORD: ${{ secrets.ANNAVUE_STORE_PASSWORD }}
          ANNAVUE_KEY_ALIAS: ${{ secrets.ANNAVUE_KEY_ALIAS }}
          ANNAVUE_KEY_PASSWORD: ${{ secrets.ANNAVUE_KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
      - name: Upload signed release APK
        if: env.RELEASE_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Annavue-0.5.0-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Explain skipped signed release
        if: env.RELEASE_SIGNING_READY != 'true'
        run: echo "::notice::Signed release skipped because the four ANNAVUE signing secrets are not configured."
